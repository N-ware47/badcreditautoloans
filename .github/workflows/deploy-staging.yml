
name: Bad Credit Auto Loans - Staging

on:
  push:
    branches:
      - main
    paths:
      - "wp-content/themes/badcreditautoloans-child/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badcreditautoloans-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Gutenberg Child Theme
    runs-on: ubuntu-latest
    environment: staging 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/badcreditautoloans-child \
            -type f -name '*.php' -print0 |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Verify required theme files
        shell: bash
        run: |
          set -euo pipefail
          THEME="wp-content/themes/badcreditautoloans-child"

          test -f "$THEME/style.css"
          test -f "$THEME/functions.php"
          test -f "$THEME/theme.json"

          echo "Theme validation passed."
          echo "SSH deployment is not enabled yet."
          echo "No SiteGround files were modified."


  ssh_test:
    name: Test SiteGround SSH Connection
    needs: validate
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_siteground
          chmod 600 ~/.ssh/id_siteground

      - name: Test SSH connection (read only)
        shell: bash
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_PATH: ${{ vars.STAGING_THEME_PATH }}
        run: |
          set -euo pipefail
          printf '%s\n' '[ssh.badcreditautoloans.net]:18765 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHguew7s8qU9WCyUvstxqvFrCOmPFrDxILOjIQHRPYyf' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_siteground \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$STAGING_PATH' && echo 'Staging theme directory exists'"

  
  deploy_dry_run:
    name: Preview Staging Theme Deployment
    needs: ssh_test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_siteground
          chmod 600 ~/.ssh/id_siteground

      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '[ssh.badcreditautoloans.net]:18765 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHguew7s8qU9WCyUvstxqvFrCOmPFrDxILOjIQHRPYyf' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preview theme upload
        shell: bash
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_PATH: ${{ vars.STAGING_THEME_PATH }}
        run: |
          set -euo pipefail

          test "$SSH_HOST" = "ssh.badcreditautoloans.net"
          test "$SSH_PORT" = "18765"
          test "$SSH_USER" = "u52-d9vb1kwmvkf1"
          test "$STAGING_PATH" = "/home/customer/www/staging2.badcreditautoloans.net/public_html/wp-content/themes/badcreditautoloans-child/"

          rsync -avzn --itemize-changes \
            -e "ssh -i $HOME/.ssh/id_siteground -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" \
            wp-content/themes/badcreditautoloans-child/ \
            "$SSH_USER@$SSH_HOST:$STAGING_PATH"
      